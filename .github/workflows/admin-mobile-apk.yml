# Free Android APK build of the Desk (Editor/Admin) app (admin-mobile/) on GitHub Actions.
# Runs on every push to main or feature/* that changes admin-mobile/, or manually:
# GitHub repo -> Actions -> "Desk (Editor/Admin) mobile – Android APK" -> Run workflow (optionally enter an API URL).
# API URL used: the manual input, else the repository variable API_URL, else admin-mobile/src/config.js.
# Download it: open the finished run -> Artifacts -> jv-desk-apk (a zip containing app-release.apk).
name: Desk (Editor/Admin) mobile – Android APK
on:
  push:
    branches: ["feature/**", "main"]
    paths: ["admin-mobile/**", ".github/workflows/admin-mobile-apk.yml"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "API server URL the app should use (e.g. https://jaathiya-api.onrender.com or http://192.168.1.10:4000)"
        required: false
        default: ""
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: admin-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Create Expo project and install libraries
        run: ./setup.sh
      - name: Point the app at your server
        working-directory: admin-mobile/jv-mobile
        env:
          API_URL: ${{ github.event.inputs.api_url || vars.API_URL }}
        run: |
          if [ -n "$API_URL" ]; then echo "export const API_BASE = '$API_URL';" > src/config.js; fi
          cat src/config.js
      - name: Generate the native Android project
        working-directory: admin-mobile/jv-mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (signed with the debug key, for testing only)
        working-directory: admin-mobile/jv-mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jv-desk-apk
          path: admin-mobile/jv-mobile/android/app/build/outputs/apk/release/app-release.apk
