# Free Android build of the Reporter app (jaathiya-vaartalu-reporter-mobile/) on GitHub Actions.
# Runs on every push to main or feature/* that changes jaathiya-vaartalu-reporter-mobile/, or manually:
# GitHub repo -> Actions -> "Reporter mobile – Android" -> Run workflow (optionally enter an API URL).
# API URL used: the manual input, else the production server https://jaathiya-vaartalu-studio-app.onrender.com (jaathiya-vaartalu-reporter-mobile/src/config.js).
# Download it: open the finished run -> Artifacts -> jv-reporter-apk (a zip containing app-release.apk, signed with the
# debug key, for testing only). The iOS builds are in jaathiya-vaartalu-reporter-mobile-ios.yml.
name: Reporter mobile – Android
on:
  push:
    branches: ["feature/**", "main"]
    paths: ["jaathiya-vaartalu-reporter-mobile/**", ".github/workflows/jaathiya-vaartalu-reporter-mobile-android.yml"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "API server URL the app should use (e.g. http://192.168.1.10:4000 for a local server)"
        required: false
        default: "https://jaathiya-vaartalu-studio-app.onrender.com"
env:
  EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://jaathiya-vaartalu-studio-app.onrender.com' }}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: jaathiya-vaartalu-reporter-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Create Expo project and install libraries
        run: ./setup.sh
      - name: Show which server the app will use
        run: |
          echo "API: $EXPO_PUBLIC_API_URL"
      - name: Generate the native Android project
        working-directory: jaathiya-vaartalu-reporter-mobile/jv-mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (signed with the debug key, for testing only)
        working-directory: jaathiya-vaartalu-reporter-mobile/jv-mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jv-reporter-apk
          path: jaathiya-vaartalu-reporter-mobile/jv-mobile/android/app/build/outputs/apk/release/app-release.apk
