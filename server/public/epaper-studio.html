<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-paper Studio – Jaathiya Vaarthalu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Serif+Telugu:wght@400;700&family=Ramabhadra&family=Anek+Telugu:wdth,wght@75..100,600..800&display=swap" rel="stylesheet">
<!--JV_CONFIG-->
<style>
:root{
  --bg:#E4E7EC;--panel:#FFFFFF;--panel2:#F2F4F7;--ink:#1A2130;--muted:#586274;--line:#C8CFD9;
  --act:#1F3C99;--act-ink:#FFFFFF;--warn:#B4231F;--ok:#17734A;
  --np-red:#E31E24;--np-deep:#9E1118;--np-gold:#F2B630;--np-navy:#1B2A6B;--np-blue:#1F3C99;--np-yellow:#FFD60A;--np-pink:#D8127A;--np-ink:#141414;--paper:#FFFFFF;
  --s:1;--inv:1;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151C;--panel:#1A2029;--panel2:#232B37;--ink:#E6EAF0;--muted:#9BA6B7;--line:#313B4A;--act:#86A2EE;--act-ink:#0D1220}}
:root[data-theme="dark"]{--bg:#11151C;--panel:#1A2029;--panel2:#232B37;--ink:#E6EAF0;--muted:#9BA6B7;--line:#313B4A;--act:#86A2EE;--act-ink:#0D1220}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 "Noto Sans Telugu",system-ui,sans-serif}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;min-height:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;margin-right:6px}
.logo{width:34px;height:34px;display:grid;place-items:center;background:var(--np-red);color:#fff;font:22px Ramabhadra,sans-serif;border-radius:6px}
.brand b{display:block;font-size:14px;line-height:1.1}.brand small{color:var(--muted);font-size:12px}
.spacer{flex:1}
.savestate{font-size:12px;color:var(--muted);white-space:nowrap}
.savestate.warn{color:#C77700;font-weight:600}.savestate.err{color:#D62828;font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;border-radius:8px;font-size:14px;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:hover{border-color:var(--act)}
.btn.primary{background:var(--act);color:var(--act-ink);border-color:var(--act);font-weight:700}
.btn.danger{color:var(--warn)}
select{border:1px solid var(--line);background:var(--panel2);padding:7px 8px;border-radius:8px;max-width:240px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.chip.pub{background:var(--ok);color:#fff;border-color:var(--ok)}
.chip.dirty{background:#C77700;color:#fff;border-color:#C77700}

.strip{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.thumb{position:relative;flex:0 0 auto;width:78px;height:104px;border:2px solid var(--line);border-radius:6px;background:#fff;color:#141414;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.thumb.active{border-color:var(--act);box-shadow:0 0 0 2px var(--act)}
.thumb .tn{font:22px Ramabhadra,sans-serif;color:var(--np-red)}
.thumb .tl{font-size:11px;text-align:center;line-height:1.2;max-height:2.4em;overflow:hidden}
.thumb .tc{font-size:10px;color:#666}
.thumb .handle{position:absolute;top:2px;right:3px;font-size:14px;color:#888;touch-action:none;padding:2px}
.thumb.drop-hi{border-color:var(--np-pink)}
.addpage{flex:0 0 auto;width:78px;height:104px;border:2px dashed var(--line);border-radius:6px;background:transparent;color:var(--muted)}

.main{display:grid;grid-template-columns:320px 1fr;min-height:0}
.pool{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pool-head{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.pool-head b{font-size:15px}.pool-head span{color:var(--muted);font-size:13px}
.pool-head .x{margin-left:auto;display:none;border:0;background:transparent;font-size:18px}
.pool input[type=search]{margin:6px 12px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 12px}
.chips button{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:3px 10px;font-size:13px}
.chips button[aria-pressed=true]{background:var(--act);color:var(--act-ink);border-color:var(--act)}
.prow{display:flex;gap:6px;padding:6px 12px}.prow select{flex:1;min-width:0}
.list{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:8px}
.list.drop-hi{background:color-mix(in srgb,var(--act) 10%,transparent)}
.card{display:grid;grid-template-columns:18px 56px 1fr;gap:8px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:grab;user-select:none}
.card.sel{border-color:var(--act);box-shadow:0 0 0 2px var(--act)}
.card.placed{opacity:.6}
.card .handle{color:var(--muted);touch-action:none;font-size:16px;text-align:center}
.card img,.card .noimg{width:56px;height:44px;object-fit:cover;border-radius:5px;background:var(--line);display:grid;place-items:center;color:var(--muted)}
.card h4{margin:0;font-size:14px;line-height:1.3;font-weight:700}
.card small{display:block;color:var(--muted);font-size:12px}
.card em{font-style:normal;font-size:11px;color:var(--ok);font-weight:700}
.hint{margin:0;padding:8px 12px 12px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
.empty-pool{color:var(--muted);font-size:13px;padding:20px 4px;text-align:center}

.stage{display:flex;flex-direction:column;min-height:0;min-width:0}
.pagebar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.pagebar input{border:1px solid var(--line);background:var(--panel2);padding:6px 8px;border-radius:8px;width:150px}
.canvas{flex:1;overflow:auto;padding:16px 16px 96px} /* bottom room so the pick bar never covers the page */

/* ---------- newspaper ---------- */
.pg-outer{width:calc(820px*var(--s));height:calc(1240px*var(--s));margin:0 auto 22px;position:relative}
.paper{position:absolute;top:0;left:0;width:820px;height:1240px;transform:scale(var(--s));transform-origin:0 0;background:var(--paper);color:var(--np-ink);padding:22px 24px 16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.2),0 10px 30px rgba(15,25,45,.18)}
.mast{display:grid;grid-template-columns:150px 1fr 168px;gap:14px;height:168px}
.tribute.haslogo{background:transparent}
.tribute .mlogo{width:100%;height:100%;object-fit:contain}
.ilogo{height:52px;width:auto}
.tribute{background:#ECECEC;overflow:hidden;display:grid;place-items:center;color:#999;font-size:13px;text-align:center}
.tribute img{width:100%;height:100%;object-fit:cover}
.mtitle{display:flex;flex-direction:column;align-items:center;justify-content:center}
.mtitle{min-width:0;overflow:hidden}
/* Masthead title: Anek Telugu ExtraBold (condensed), crimson-to-deep-red fill with a gold and navy
   3D edge that picks up the logo's colours. Falls back to solid red where text gradients aren't supported. */
.mt{font:800 96px/1.1 'Anek Telugu',Ramabhadra,sans-serif;font-stretch:75%;color:var(--np-red);white-space:nowrap;transform-origin:center;
  /* Telugu vowel signs rise above the line box and the gradient only paints inside the element's box,
     so pad it to cover the full glyph height (otherwise the tops of ి, ా… are clipped). */
  padding:.24em .06em .14em;margin:-.2em 0 -.1em;
  filter:drop-shadow(2px 2px 0 var(--np-gold)) drop-shadow(2px 2px 0 var(--np-navy))}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .mt{background:linear-gradient(180deg,#FF3A3F 0%,var(--np-red) 52%,#9E0C12 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
}
.tg{font:700 15px 'Anek Telugu',"Noto Sans Telugu",sans-serif;color:var(--np-navy);letter-spacing:.5px;margin-top:4px}
.adbox{border:2px solid var(--np-red);padding:5px;text-align:center;font:600 12px/1.35 "Noto Sans Telugu",sans-serif;display:flex;flex-direction:column;gap:4px}
.adbox b{background:var(--np-red);color:var(--np-yellow);font:400 24px/1.15 Ramabhadra,sans-serif;padding:3px}
.adbox p{margin:0;flex:1;overflow:hidden}
.adbox .ph{background:var(--np-red);color:#fff;font-weight:700;padding:2px 6px;align-self:center}
.band{background:var(--np-red);color:#fff;font:600 13px/1.35 "Noto Sans Telugu",sans-serif;text-align:center;padding:5px 8px;margin-top:10px}
.info{display:flex;width:max-content;min-width:100%;margin:6px 0 12px;font:700 14px/1 "Noto Sans Telugu",sans-serif;transform-origin:left center}
.info span{padding:7px 9px;white-space:nowrap}
.info .b{background:var(--np-blue);color:#fff}.info .y{background:var(--np-yellow);color:var(--np-ink)}.info .r{background:var(--np-yellow);color:var(--np-red)}
.info .grow{flex:1;text-align:center}
.ihead{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--np-blue);padding-bottom:7px;margin-bottom:12px}
.pno{width:46px;height:46px;border-radius:50%;background:var(--np-red);color:#fff;display:grid;place-items:center;font:28px Ramabhadra,sans-serif}
.minimast{background:var(--np-yellow);color:var(--np-red);font:800 32px/1.45 'Anek Telugu',Ramabhadra,sans-serif;font-stretch:75%;padding:2px 14px 0;border:2px solid var(--np-red);text-shadow:1px 1px 0 var(--np-navy)}
.seclabel{font:700 16px "Noto Sans Telugu",sans-serif;color:var(--np-red)}
.datebar{margin-left:auto;background:var(--np-blue);color:#fff;font:700 17px "Noto Sans Telugu",sans-serif;padding:7px 16px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.slot{position:relative;min-height:0;min-width:0;overflow:hidden}
.slot.filled{border-bottom:1px solid #BDBDBD;padding-bottom:6px}
.slot.editable.filled:hover{outline:2px solid color-mix(in srgb,var(--act) 55%,transparent)}
.slot.drop-hi{outline:3px solid var(--np-pink)!important;outline-offset:-3px;background:rgba(216,18,122,.06)}
.empty{height:100%;border:2px dashed #AFB7C4;border-radius:4px;display:grid;place-items:center;color:#7A8494;font-size:calc(13px*var(--inv));text-align:center;padding:4px;background:repeating-linear-gradient(135deg,#FAFBFC 0 10px,#F2F4F7 10px 20px)}
.pick .empty{border-color:var(--np-pink);color:var(--np-pink)}
.story{height:100%;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.story h3{margin:0;font-family:Ramabhadra,sans-serif;font-weight:400;color:var(--np-red);line-height:1.18}
.k-lead h3{font-size:calc(44px*var(--fs,1))}.k-story h3{font-size:calc(26px*var(--fs,1))}.k-brief h3{font-size:calc(19px*var(--fs,1));color:var(--np-deep)}
.s-blue h3{background:var(--np-blue);color:#fff;padding:5px 10px}
.s-boxed{border:3px solid var(--np-red);padding:7px}
.s-boxed h3{color:var(--np-blue);text-align:center}
.deck{list-style:none;margin:0;padding:6px 10px;background:var(--np-pink);color:#fff;font:700 calc(14px*var(--fs,1))/1.55 "Noto Sans Telugu",sans-serif;text-align:center}
.deck li::before{content:"- "}
/* auto-fit (fitStories): the photo takes the space the text leaves, between --ph and --pmax */
.pics{flex:1 1 var(--ph,130px);min-height:var(--ph,70px);max-height:var(--pmax,none);display:flex;gap:6px}
.pics img{flex:1;min-width:0;width:100%;height:100%;object-fit:cover}
.body{flex:none;font:calc(14px*var(--fs,1))/1.62 "Noto Serif Telugu",serif;text-align:justify}
.story.cut .body{flex:1 1 0;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}
.story.cut .pics{flex:0 0 var(--ph)}
.story.nophoto .pics{display:none}
.k-story .pics img:nth-child(n+2),.k-brief .pics img:nth-child(n+2),.k-brief .deck{display:none}
.grid.measure .pics{flex:0 0 70px!important;min-height:0!important;max-height:none!important}
.slot.addslot{position:absolute;left:50%;bottom:calc(10px*var(--inv));transform:translateX(-50%);z-index:3;overflow:visible;white-space:nowrap;cursor:pointer;
  background:var(--panel);color:var(--np-pink);border:2px dashed var(--np-pink);border-radius:99px;font:700 calc(13px*var(--inv)) system-ui,sans-serif;padding:calc(6px*var(--inv)) calc(14px*var(--inv));box-shadow:0 4px 14px rgba(0,0,0,.18)}
.pick .slot.addslot{background:var(--np-pink);color:#fff}
.addslot.over{position:absolute;left:50%;bottom:calc(10px*var(--inv));transform:translateX(-50%);z-index:3;white-space:nowrap;background:#D62828;color:#fff;border:0;border-radius:99px;
  font:700 calc(13px*var(--inv)) system-ui,sans-serif;padding:calc(6px*var(--inv)) calc(14px*var(--inv));box-shadow:0 4px 14px rgba(0,0,0,.18)}
.thumb .tc.over{color:#fff;background:#D62828;border-radius:99px;padding:0 6px}
.cutflag{position:absolute;left:4px;bottom:10px;z-index:2;background:var(--np-red);color:#fff;font:700 calc(11px*var(--inv)) system-ui,sans-serif;padding:calc(2px*var(--inv)) calc(7px*var(--inv));border-radius:99px;pointer-events:none}
.k-lead .body{column-count:2;column-gap:16px}
.body b{font-family:"Noto Sans Telugu",sans-serif}
.by{font:600 11.5px "Noto Sans Telugu",sans-serif;color:#555}
.imprint{border-top:2px solid var(--np-blue);margin-top:10px;padding-top:6px;font:600 10.5px/1.4 system-ui,sans-serif;text-align:center;color:#222}
.tools{position:absolute;top:4px;right:4px;display:flex;gap:calc(4px*var(--inv));z-index:2}
.tbtn{width:calc(30px*var(--inv));height:calc(30px*var(--inv));border:0;border-radius:50%;background:rgba(20,26,40,.82);color:#fff;font-size:calc(14px*var(--inv));display:grid;place-items:center;touch-action:none}
.viewer .story,.previewing .story{cursor:zoom-in}

.fab{display:none}
.pickbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:10px;align-items:center;background:var(--np-pink);color:#fff;padding:10px 12px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pickbar span{flex:1;font-size:14px}.pickbar button{border:0;background:#fff;color:var(--np-pink);padding:6px 12px;border-radius:8px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 40px));visibility:hidden;transition:transform .2s,visibility .2s;background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:10px;z-index:60;display:flex;gap:12px;align-items:center;max-width:92vw;font-size:14px}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast button{border:0;background:transparent;color:var(--np-yellow);font-weight:700}
.ghost-drag{position:fixed;z-index:80;pointer-events:none;background:var(--panel);color:var(--ink);border:2px solid var(--act);border-radius:10px;padding:6px 10px;font-size:13px;max-width:240px;box-shadow:0 10px 24px rgba(0,0,0,.25);transform:translate(-50%,-120%)}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel);color:var(--ink);border-radius:14px;padding:18px;width:min(560px,100%);max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:19px}
.sheet label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.sheet input,.sheet textarea,.sheet select{width:100%;max-width:none;border:1px solid var(--line);background:var(--panel2);padding:8px 10px;border-radius:8px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .err{color:var(--warn);font-size:13px;min-height:1em}
.reader img{width:100%;border-radius:8px;margin-bottom:8px}
.reader h2{font:400 30px/1.2 Ramabhadra,sans-serif;color:var(--np-red)}
.reader p{font:16px/1.75 "Noto Serif Telugu",serif}
.reader .deck{border-radius:6px;margin-bottom:10px;text-align:left}
.linkbox{display:flex;gap:6px}.linkbox input{flex:1}

.viewer .pool,.viewer .pagebar,.viewer #newEd,.viewer #edSel,.viewer #publishBtn,.viewer #settingsBtn,.viewer #previewBtn,.viewer #saveBtn,.viewer #saveState,.viewer #logoutBtn,.viewer .addpage,.viewer .thumb .handle,.viewer .fab{display:none!important}
.viewer .main,.previewing .main{grid-template-columns:1fr}
.previewing .pool,.previewing .pagebar,.previewing .fab{display:none!important}

@media screen and (max-width:860px){
  .main{grid-template-columns:1fr}
  .pool{position:fixed;left:0;right:0;bottom:0;height:72vh;z-index:40;border-radius:16px 16px 0 0;border:1px solid var(--line);transform:translateY(105%);transition:transform .22s;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
  .pool.open{transform:none}
  .pool-head .x{display:block}
  .fab{display:block;position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;border:0;background:var(--act);color:var(--act-ink);font-weight:700;padding:12px 16px;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
  .canvas{padding:10px 10px 96px}
  .top{gap:6px}.brand small{display:none}
  .btn{padding:6px 9px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:820px 1240px;margin:0}
  /* print the newspaper colours (red bands, pink decks, blue date bar) even when the
     browser's "Background graphics" option is off, which is its default */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html,body{background:#fff!important;height:auto}
  .top,.strip,.pool,.pagebar,.fab,.pickbar,.toast,.modal{display:none!important}
  .app{display:block;height:auto}.canvas{padding:0;overflow:visible}
  .pg-outer{width:820px!important;height:1240px!important;margin:0;break-after:page}
  .paper{transform:none!important;box-shadow:none}
  .tools,.empty,.cutflag,.addslot{display:none!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">జా</span><div><b>E-paper Studio</b><small id="modeTag"></small></div></div>
    <select id="edSel" aria-label="Edition"></select>
    <button class="btn" id="newEd">New edition</button>
    <span class="chip" id="status"></span>
    <span class="savestate" id="saveState" role="status" aria-live="polite"></span>
    <div class="spacer"></div>
    <button class="btn" id="saveBtn" title="Save (Ctrl+S)">Save</button>
    <button class="btn" id="settingsBtn">Masthead</button>
    <button class="btn" id="previewBtn">Preview</button>
    <button class="btn" id="printBtn">PDF</button>
    <button class="btn primary" id="publishBtn">Publish</button>
    <button class="btn" id="logoutBtn" hidden>Log out</button>
  </header>
  <nav class="strip" id="strip" aria-label="Pages"></nav>
  <div class="main">
    <aside class="pool" id="pool" aria-label="Approved news">
      <div class="pool-head"><b>Approved news</b><span id="poolCount"></span><button class="x" id="poolClose" aria-label="Close">✕</button></div>
      <input id="q" type="search" placeholder="Search headlines">
      <div class="chips" id="secChips"></div>
      <div class="prow"><select id="stateSel" aria-label="State"></select><select id="distSel" aria-label="District"></select></div>
      <div class="prow"><select id="conSel" aria-label="Constituency"></select></div>
      <div class="list" id="poolList" data-drop="pool"></div>
      <p class="hint">Drag a card onto the page, or tap a card and then tap an empty box. Drag a story back here to remove it.</p>
    </aside>
    <section class="stage">
      <div class="pagebar" id="pagebar"></div>
      <div class="canvas" id="canvas"></div>
    </section>
  </div>
  <button class="fab" id="poolFab">News</button>
  <div class="pickbar" id="pickbar" hidden><span id="pickText"></span><button id="pickCancel">Cancel</button></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</div>

<script>
(() => {

const COLS = 12;

// Candidate arrangements for n stories on a 12-column grid: a full-width lead, or a lead (8 cols)
// with 1-3 stories stacked beside it; the rest go in rows of up to 4. Quarter-width boxes are briefs.
function genLayouts(n) {
  if (genCache[n]) return genCache[n];
  const out = [];
  if (n === 1) return genCache[1] = [{ rows: [Array(COLS).fill(0)], w: [1], kinds: ['lead'] }];
  const rowOf = idxs => idxs.flatMap(ix => Array(COLS / idxs.length).fill(ix));
  for (const side of [0, 1, 2, 3]) {
    const m = n - 1 - side; if (m < 0) continue;
    const splits = [];
    if (!m) splits.push([]);
    else for (let R = Math.ceil(m / 4); R <= Math.min(m, Math.ceil(m / 4) + 1); R++) {
      const base = Math.floor(m / R), extra = m % R;
      const small = Array(R - extra).fill(base), big = Array(extra).fill(base + 1);
      splits.push([...small, ...big]); if (extra && R - extra) splits.push([...big, ...small]);
    }
    for (const counts of splits) for (const hL of counts.length ? [2.4, 1.6] : [1]) {
      const rows = [], w = [], kinds = ['lead'];
      if (!side) { rows.push(Array(COLS).fill(0)); w.push(hL); }
      else for (let k = 1; k <= side; k++) { rows.push([...Array(8).fill(0), ...Array(4).fill(k)]); w.push(hL / side); kinds[k] = 'story'; }
      let next = 1 + side;
      for (const c of counts) {
        const idxs = Array.from({ length: c }, (_, k) => next + k); next += c;
        rows.push(rowOf(idxs)); w.push(1); idxs.forEach(ix => { kinds[ix] = COLS / c >= 4 ? 'story' : 'brief'; });
      }
      out.push({ rows, w, kinds });
    }
  }
  return genCache[n] = out;
}

/* ---------- state ---------- */
const S = { news: [], editions: [], cur: null, pageIdx: 0, sel: null, preview: false, viewer: false,
  filter: { q: '', section: 'all', state: 'all', district: 'all', constituency: 'all' } };
const byId = id => S.news.find(n => n.id === id);
const ed = () => S.editions.find(e => e.id === S.cur);
const narrow = () => window.matchMedia('(max-width:860px)').matches;

function makeEdition(type, key, date) {
  const t = EDITION_TYPES[type];
  return { id: 'e' + uid(), type, key: key || '', editionDate: date || todayISO(),
    title: t.label + (key ? ' – ' + key : ''), status: 'draft', shareSlug: null, dirty: false,
    volume: '01', issue: String(store.get('jv_issue', 236)), price: BRAND.price, ad: { ...BRAND.ad }, tribute: null,
    pages: t.pages.map(([template, label]) => ({ id: 'p' + uid(), template, label, slots: {}, styles: {} })) };
}
function placements() {
  const m = {}; const e = ed(); if (!e) return m;
  e.pages.forEach((p, i) => Object.entries(p.slots).forEach(([s, id]) => { if (id) m[id] = { page: i, slot: s }; }));
  return m;
}

/* ---------- API (when served by the backend) ---------- */
// The access token lasts 15 minutes; on a 401 the studio swaps its 30-day refresh token for a new
// pair once and retries, so long editing sessions keep saving. (Inside the mobile app the app owns
// the session and passes window.__JV_TOKEN instead.)
const setSession = d => { store.set('jv_token', d.accessToken); store.set('jv_refresh', d.refreshToken); if (d.user) store.set('jv_user', d.user); };
const clearSession = () => ['jv_token', 'jv_refresh', 'jv_user'].forEach(k => store.del(k));
const API = {
  token: () => window.__JV_TOKEN || store.get('jv_token', null),
  refresh() {
    const rt = !window.__JV_TOKEN && store.get('jv_refresh', null); if (!rt) return Promise.resolve(false);
    return API._ref = API._ref || fetch(CFG.apiBase + '/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refreshToken: rt }) })
      .then(r => r.ok ? r.json().then(d => { setSession(d); return true; }) : false).catch(() => false).finally(() => { API._ref = null; });
  },
  async req(path, opt = {}, retry = true) {
    const t = API.token();
    const r = await fetch(CFG.apiBase + path, { ...opt, headers: { 'Content-Type': 'application/json', ...(t ? { Authorization: 'Bearer ' + t } : {}) } });
    if (r.status === 401) {
      if (retry && await API.refresh()) return API.req(path, opt, false);
      showLogin(); throw new Error('Sign in to continue.');
    }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.message || 'Request failed (' + r.status + ')');
    return d;
  }
};
const mapNews = n => ({ id: n._id || n.id, section: n.section, state: n.state || STATE_OF[n.district], district: n.district, constituency: n.constituency, dateline: n.dateline,
  title: n.title, highlights: n.highlights || [], body: n.body, images: n.images || [], reporter: (n.author && n.author.name) || n.reporter || '' });
const mapEd = e => ({ ...e, id: e._id || e.id, editionDate: String(e.editionDate).slice(0, 10), ad: e.ad || { ...BRAND.ad },
  pages: (e.pages || []).map(p => ({ ...p, slots: p.slots || {}, styles: p.styles || {} })) });
function mergeNews(list) { list.map(mapNews).forEach(n => { if (!byId(n.id)) S.news.push(n); }); }

async function loadAll() {
  if (MODE === 'demo') {
    S.news = DEMO_NEWS.slice();
    S.editions = store.get('jv_editions', null) || [];
    if (!S.editions.length) {
      const e = makeEdition('state', 'ఆంధ్రప్రదేశ్', todayISO());
      S.editions.push(e); S.cur = e.id;
      // section pages (sports, business) first so their news is not used up elsewhere
      e.pages.map((p, i) => i).sort((a, b) => !!silentFilterFromPage(e.pages[b]) - !!silentFilterFromPage(e.pages[a]))
        .forEach(i => { S.pageIdx = i; autoFill(true); });
      S.pageIdx = 0; persistNow();
    }
    S.cur = S.cur || S.editions[0].id;
    return;
  }
  const [pool, eds] = await Promise.all([API.req('/news?status=approved&limit=300'), API.req('/epapers?limit=60')]);
  S.news = pool.items.map(mapNews);
  S.editions = eds.items.map(mapEd);
  if (!S.editions.length) {
    const created = await API.req('/epapers', { method: 'POST', body: JSON.stringify(stripEd(makeEdition('state', 'ఆంధ్రప్రదేశ్', todayISO()))) });
    S.editions.push(mapEd(created.epaper));
  }
  S.cur = S.editions[0].id;
  await loadEditionNews();
}
async function loadEditionNews() {
  if (MODE !== 'api') return;
  const d = await API.req('/epapers/' + S.cur);
  mergeNews(d.news || []);
  const i = S.editions.findIndex(e => e.id === S.cur);
  if (i >= 0) S.editions[i] = mapEd(d.epaper);
}
const stripEd = e => ({ title: e.title, type: e.type, key: e.key, editionDate: e.editionDate, volume: e.volume, issue: e.issue,
  price: e.price, ad: e.ad, tribute: e.tribute, pages: e.pages });

// Saving: every change marks its edition unsaved and autosaves after a short pause; Save / Ctrl+S
// save at once. Unsaved editions are tracked by id so switching editions never loses a change.
let saveTimer = null, saving = null, saveErr = null;
const unsaved = new Set();
function showSave() {
  const el = $('#saveState'); if (!el) return;
  const [txt, cls] = saving ? ['Saving…', ''] : saveErr ? ['Not saved', 'err'] : unsaved.size ? ['Unsaved changes', 'warn'] : ['All changes saved', ''];
  el.textContent = txt; el.className = 'savestate' + (cls ? ' ' + cls : ''); el.title = saveErr || '';
}
// Saves every edition with unsaved changes; resolves true when everything is saved.
async function saveAll() {
  clearTimeout(saveTimer);
  if (saving) { await saving; if (!unsaved.size) return !saveErr; }
  if (MODE === 'demo') { store.set('jv_editions', S.editions); unsaved.clear(); saveErr = null; showSave(); return true; }
  if (!unsaved.size) { showSave(); return !saveErr; }
  saving = (async () => {
    saveErr = null;
    for (const id of [...unsaved]) {
      const e = S.editions.find(x => x.id === id); if (!e) { unsaved.delete(id); continue; }
      unsaved.delete(id); // a change made while this request is in flight marks it unsaved again
      try { await API.req('/epapers/' + id, { method: 'PUT', body: JSON.stringify(stripEd(e)) }); }
      catch (err) { unsaved.add(id); saveErr = err.message; }
    }
  })();
  showSave();

      st.style.setProperty('--pmax', pmax + 'px');

                   ...[0.8, 0.6, 0.4, 0.2, 0].map(t => [1, pmin + (pref - pmin) * t]),
                   ...FS_STEPS.filter(k => k < 1 && k >= 0.88).map(k => [k, pmin])]);
      // Box too small for photo + readable text: drop the photo rather than print tiny type.
      if (ok === undefined) { st.classList.add('nophoto'); ok = tryAll(FS_STEPS.filter(k => k <= 1).map(k => [k])); if (ok !== undefined) note(slot, 'Photo hidden: box too small'); }
    } else ok = tryAll(FS_STEPS.map(k => [k]));
    if (ok === undefined) { st.classList.add('cut'); note(slot, 'Text cut'); score += 100; }
    else score += (st.classList.contains('nophoto') ? 8 : 0) + Math.max(0, 1 - ok[0]) * 20;
  });
  return score;
}
function note(slot, msg) { if (slot.classList.contains('editable')) slot.insertAdjacentHTML('beforeend', `<span class="cutflag">${msg}</span>`); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutCache.clear(); fitText(); relayout(); });

/* ---------- toast & modal ---------- */
let toastT;
function toast(msg, actLabel, act) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button>${esc(actLabel)}</button>` : ''}`;
  if (actLabel) t.querySelector('button').onclick = () => { t.classList.remove('show'); act(); };
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), actLabel ? 6000 : 3200);
}
function openModal(html, onMount) { $('#sheet').innerHTML = html; $('#modal').hidden = false; onMount && onMount($('#sheet')); }
function closeModal() { $('#modal').hidden = true; $('#sheet').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (S.sel) { S.sel = null; renderAll(); } } });

function openReader(id) {
  const n = byId(id); if (!n) return;
  openModal(`<div class="reader">${(n.images || []).map(u => `<img src="${esc(u)}" alt="">`).join('')}
    <h2>${esc(n.title)}</h2>${(n.highlights || []).length ? `<ul class="deck">${n.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}
    <p><b>${esc(n.dateline || n.constituency || '')}, ${datelineDate(ed().editionDate)} :</b> ${esc(n.body)}</p>
    <p class="by">${esc(n.reporter || '')} (${esc(BRAND.masthead)} ప్రతినిధి)</p>
    <div class="acts"><button class="btn" data-close>Close</button></div></div>`);
}
function openNewEdition() {
  const opts = Object.entries(EDITION_TYPES).map(([k, t]) => `<option value="${k}">${t.label}</option>`).join('');
  openModal(`<h2>New edition</h2>
    <label for="neType">Edition type</label><select id="neType">${opts}</select>
    <div id="neKeyWrap"><label for="neKey">State / district / constituency</label><select id="neKey"></select></div>
    <label for="neDate">Date</label><input id="neDate" type="date" value="${todayISO()}">
    <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn primary" id="neGo">Create edition</button></div>`, sh => {
    const sync = () => {
      const t = sh.querySelector('#neType').value; const wrap = sh.querySelector('#neKeyWrap'); const key = sh.querySelector('#neKey');
      wrap.hidden = !(t === 'state' || t === 'district' || t === 'constituency');
      key.innerHTML = t === 'state' ? Object.keys(STATES).map(st => `<option>${st}</option>`).join('')
        : t === 'district' ? Object.entries(STATES).map(([st, ds]) => `<optgroup label="${st}">${Object.keys(ds).map(d => `<option>${d}</option>`).join('')}</optgroup>`).join('')
        : Object.entries(DISTRICTS).map(([d, cs]) => `<optgroup label="${d}">${cs.map(c => `<option>${c}</option>`).join('')}</optgroup>`).join('');
    };
    sh.querySelector('#neType').onchange = sync; sync();
    sh.querySelector('#neGo').onclick = async () => {
      const t = sh.querySelector('#neType').value; const k = sh.querySelector('#neKeyWrap').hidden ? '' : sh.querySelector('#neKey').value;
      let e = makeEdition(t, k, sh.querySelector('#neDate').value || todayISO());
      try {
        if (MODE === 'api') e = mapEd((await API.req('/epapers', { method: 'POST', body: JSON.stringify(stripEd(e)) })).epaper);
        else store.set('jv_issue', Number(e.issue) + 1);
        S.editions.unshift(e); S.cur = e.id; S.pageIdx = 0; filterForEdition(e); closeModal(); persistNow(); renderAll();
        toast('Edition created. Use Auto-fill or drag news onto each page.');
      } catch (err) { toast(err.message); }
    };
  });
}
function openSettings() {
  const e = ed();
  openModal(`<h2>Masthead and issue details</h2>
    <div class="two"><div><label>సంపుటి (Volume)</label><input id="sVol" value="${esc(e.volume)}"></div><div><label>సంచిక (Issue)</label><input id="sIss" value="${esc(e.issue)}"></div></div>
    <div class="two"><div><label>Date</label><input id="sDate" type="date" value="${e.editionDate}"></div><div><label>వెల (Price)</label><input id="sPrice" value="${esc(e.price)}"></div></div>
    <label>Edition name</label><input id="sTitle" value="${esc(e.title)}">
    <label>Box heading (right of masthead)</label><input id="sAdT" value="${esc(e.ad.title)}">
    <label>Box text</label><textarea id="sAdX" rows="3">${esc(e.ad.text)}</textarea>
    <label>Phone</label><input id="sAdP" value="${esc(e.ad.phone)}">
    <label>Photo left of masthead (shows the logo when empty)</label><input id="sImg" type="file" accept="image/*">
    ${e.tribute ? '<button class="btn danger" id="sImgDel" style="margin-top:8px">Remove photo</button>' : ''}
    <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn primary" id="sSave">Save details</button></div>`, sh => {
    let img = e.tribute;
    sh.querySelector('#sImg').onchange = async ev => { const f = ev.target.files[0]; if (f) img = await shrinkImage(f, 420); };
    const del = sh.querySelector('#sImgDel'); if (del) del.onclick = () => { img = null; del.textContent = 'Photo will be removed'; };
    sh.querySelector('#sSave').onclick = () => {
      Object.assign(e, { volume: sh.querySelector('#sVol').value, issue: sh.querySelector('#sIss').value, editionDate: sh.querySelector('#sDate').value || e.editionDate,
        price: sh.querySelector('#sPrice').value, title: sh.querySelector('#sTitle').value || e.title, tribute: img,
        ad: { title: sh.querySelector('#sAdT').value, text: sh.querySelector('#sAdX').value, phone: sh.querySelector('#sAdP').value } });
      closeModal(); commit(); toast('Details saved');
    };
  });
}
function shrinkImage(file, max) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.82)); }; im.onerror = rej; im.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
async function publish() {
  const e = ed();
  const empty = e.pages.filter(p => !Object.values(p.slots).some(Boolean)).length;
  if (empty) { toast(`${empty} page${empty > 1 ? 's have' : ' has'} no news. Fill or delete ${empty > 1 ? 'them' : 'it'} before publishing.`); return; }
  const full = e.pages.findIndex((p, i) => pageIds(p).length > capFor(i));
  if (full >= 0) { S.pageIdx = full; S.preview = false; renderAll(); toast(`Page ${full + 1} has ${pageIds(e.pages[full]).length} stories; it holds up to ${capFor(full)}. Remove some before publishing.`); return; }
  if (e.status === 'published' && !e.dirty) { openShare(); return; }
  try {
    if (MODE === 'api') {
      clearTimeout(saveTimer);
      await API.req('/epapers/' + e.id, { method: 'PUT', body: JSON.stringify(stripEd(e)) });
      unsaved.delete(e.id); showSave();
      const d = await API.req('/epapers/' + e.id + '/publish', { method: 'POST' });
      Object.assign(e, mapEd(d.epaper)); e.shareUrl = d.shareUrl;
    } else {
      e.shareSlug = e.shareSlug || `${e.editionDate}-${uid().slice(0, 5)}`; e.status = 'published';
    }
    e.dirty = false; persistNow(); renderAll(); toast('Published'); openShare();
  } catch (err) { toast(err.message); }
}
function shareUrl(e) { return e.shareUrl || `${location.origin}/e/${e.shareSlug}`; }
function openShare() {
  const e = ed(); const url = shareUrl(e);
  const text = `${BRAND.masthead} – ${teDate(e.editionDate)} ఈ-పేపర్: ${url}`;
  openModal(`<h2>Share this edition</h2>
    <label>Link</label><div class="linkbox"><input id="shUrl" readonly value="${esc(url)}"><button class="btn" id="shCopy">Copy</button></div>
    ${MODE === 'demo' ? '<p class="err">Demo mode: this link starts working once the server is deployed.</p>' : ''}
    <div class="acts">
      <a class="btn" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">WhatsApp</a>
      ${navigator.share ? '<button class="btn" id="shNative">More apps</button>' : ''}
      <button class="btn" id="shPdf">Save as PDF</button>
      <button class="btn primary" data-close>Done</button></div>`, sh => {
    sh.querySelector('#shCopy').onclick = async () => { try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch (_) { sh.querySelector('#shUrl').select(); toast('Select the link and copy it'); } };
    const nat = sh.querySelector('#shNative'); if (nat) nat.onclick = () => navigator.share({ title: BRAND.masthead, text, url }).catch(() => {});
    sh.querySelector('#shPdf').onclick = () => { closeModal(); printEdition(); };
  });
}
// Print exactly what the preview shows: wait for the Telugu fonts and photos so headlines and
// text wrap the same way, fit the stories, then print. Restore the editor only after printing
// (Safari's print() returns before the page is captured).
async function printEdition() {
  const was = S.preview; S.preview = true; renderAll();
  try { await document.fonts.ready; } catch (_) {}
  await Promise.all([...document.querySelectorAll('#canvas img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  fitText(); relayout();
  const restore = () => { window.removeEventListener('afterprint', restore); if (S.preview !== was) { S.preview = was; renderAll(); } };
  window.addEventListener('afterprint', restore);
  try { window.print(); } catch (_) { restore(); toast('Printing is blocked here. Open the published link in a browser to save the PDF.'); }
}
function showLogin() {
  if (!$('#modal').hidden && $('#lgEmail')) return;
  openModal(`<h2>Sign in</h2><p style="color:var(--muted);margin:0">Editors and admins only.</p>
    <label>Email</label><input id="lgEmail" type="email" autocomplete="username">
    <label>Password</label><input id="lgPass" type="password" autocomplete="current-password">
    <p class="err" id="lgErr"></p><div class="acts"><button class="btn primary" id="lgGo">Sign in</button></div>`, sh => {
    sh.querySelector('#lgGo').onclick = async () => {
      try {
        const r = await fetch(CFG.apiBase + '/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: sh.querySelector('#lgEmail').value, password: sh.querySelector('#lgPass').value }) });
        const d = await r.json(); if (!r.ok) throw new Error(d.message || 'Sign-in failed');
        if (!['admin', 'editor'].includes(d.user.role)) throw new Error('Only editors and admins can build the e-paper.');
        setSession(d); closeModal();
        // Signed out mid-edit (session expired): keep the open work and save it, don't reload over it.
        if (S.editions.length && unsaved.size) { $('#logoutBtn').hidden = !!window.__JV_TOKEN; showUser(); await saveAll(); renderAll(); }
        else boot();
      } catch (err) { sh.querySelector('#lgErr').textContent = err.message; }
    };
  });
}

/* ---------- drag and drop (mouse, touch, pen) ---------- */
let drag = null, ghost = null, hi = null, suppressClick = false;
function press(e, payload, label) { if (e.button !== 0) return; drag = { payload, label, x: e.clientX, y: e.clientY, started: false }; }
function targetAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest('[data-drop]'); }
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 7) return;
    drag.started = true; ghost = document.createElement('div'); ghost.className = 'ghost-drag'; ghost.textContent = drag.label; document.body.appendChild(ghost);
    if (narrow() && drag.payload.type === 'news') $('#pool').classList.remove('open');
  }
  e.preventDefault();
  ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
  const t = targetAt(e.clientX, e.clientY);
  if (t !== hi) { hi && hi.classList.remove('drop-hi'); hi = t; hi && hi.classList.add('drop-hi'); }
}, { passive: false });
function endDrag(e, cancel) {
  if (!drag) return; const d = drag; drag = null;
  if (!d.started) return;
  ghost && ghost.remove(); ghost = null; hi && hi.classList.remove('drop-hi'); hi = null;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if (cancel) return;
  const t = targetAt(e.clientX, e.clientY); if (!t) return;
  const kind = t.dataset.drop, P = d.payload;
  if (P.type === 'news' && kind === 'slot') placeNews(P.id, +t.dataset.page, t.dataset.slot);
  else if (P.type === 'news' && kind === 'pool') unplace(P.id);
  else if (P.type === 'news' && kind === 'thumb') {
    const i = +t.dataset.index; const p = ed().pages[i]; const prev = placements()[P.id];
    if (prev) delete ed().pages[prev.page].slots[prev.slot];
    const over = fill(p, [P.id]); if (over.length && prev) ed().pages[prev.page].slots[prev.slot] = P.id;
    S.pageIdx = i; commit(); if (over.length) toast(`That page is full (${capFor(i)} stories). Remove a story or use another page.`);
  }
  else if (P.type === 'page' && kind === 'thumb') movePage(P.index, +t.dataset.index);
}
window.addEventListener('pointerup', e => endDrag(e, false));
window.addEventListener('pointercancel', e => endDrag(e, true));

$('#poolList').addEventListener('pointerdown', e => {
  const c = e.target.closest('[data-card]'); if (!c) return;
  if (e.pointerType !== 'mouse' && !e.target.closest('[data-handle]')) return;
  const n = byId(c.dataset.card); press(e, { type: 'news', id: n.id }, n.title);
});
$('#canvas').addEventListener('pointerdown', e => {
  if (S.preview || S.viewer) return;
  const slot = e.target.closest('.slot.filled'); if (!slot || e.target.closest('button')) return;
  if (e.pointerType !== 'mouse' && !e.target.closest('[data-shandle]')) return;
  const n = byId(slot.dataset.news); press(e, { type: 'news', id: n.id }, n.title);
});
$('#strip').addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-thumb]'); if (!t || S.viewer) return;
  if (e.pointerType !== 'mouse' && !e.target.closest('[data-phandle]')) return;
  press(e, { type: 'page', index: +t.dataset.thumb }, 'Page ' + (+t.dataset.thumb + 1));
});

/* ---------- clicks ---------- */
$('#poolList').addEventListener('click', e => {
  if (suppressClick) return; const c = e.target.closest('[data-card]'); if (!c) return;
  S.sel = S.sel === c.dataset.card ? null : c.dataset.card;
  if (S.sel && narrow()) $('#pool').classList.remove('open');
  renderAll();
});
$('#poolList').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.card) e.target.click(); });
$('#canvas').addEventListener('click', e => {
  if (suppressClick) return;
  if (S.preview || S.viewer) { const r = e.target.closest('[data-read]'); if (r) openReader(r.dataset.read); return; }
  const act = e.target.closest('[data-act]');
  const slot = e.target.closest('.slot'); if (!slot) return;
  const p = ed().pages[+slot.dataset.page];
  if (act && act.dataset.act === 'remove') { const id = p.slots[act.dataset.slot]; delete p.slots[act.dataset.slot]; commit(); toast('Removed from page', 'Undo', () => placeNews(id, +slot.dataset.page, act.dataset.slot)); return; }
  if (act && act.dataset.act === 'style') { p.styles = p.styles || {}; const cur = p.styles[act.dataset.slot] || 'red'; p.styles[act.dataset.slot] = STYLES[(STYLES.indexOf(cur) + 1) % STYLES.length]; commit(); return; }
  if (S.sel) placeNews(S.sel, +slot.dataset.page, slot.dataset.slot);
  else if (!slot.dataset.news) { if (narrow()) $('#pool').classList.add('open'); else toast('Pick a news card on the left, then tap this box.'); }
});
$('#canvas').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('slot')) e.target.click(); });
$('#strip').addEventListener('click', e => {
  if (suppressClick) return;
  if (e.target.closest('#addPageBtn')) { addPage('local'); return; }
  const t = e.target.closest('[data-thumb]'); if (!t) return;
  const i = +t.dataset.thumb;
  if (S.preview || S.viewer) { const el = document.getElementById('pg-' + i); el && el.scrollIntoView({ behavior: 'smooth' }); return; }
  S.pageIdx = i; renderAll();
});
$('#pagebar').addEventListener('change', e => {
  if (e.target.id === 'tplSel') setTemplate(S.pageIdx, e.target.value);
  if (e.target.id === 'pageLabel') { ed().pages[S.pageIdx].label = e.target.value; commit(); }
});
$('#pagebar').addEventListener('click', e => {
  if (e.target.id === 'autoBtn') autoFill(false);
  if (e.target.id === 'mergeBtn') mergeWithNext(S.pageIdx);
  if (e.target.id === 'clearPageBtn') clearPage(S.pageIdx);
  if (e.target.id === 'delPageBtn') deletePage(S.pageIdx);
});
$('#secChips').addEventListener('click', e => { const b = e.target.closest('[data-sec]'); if (b) { S.filter.section = b.dataset.sec; renderPool(); } });
$('#stateSel').onchange = e => { S.filter.state = e.target.value; S.filter.district = 'all'; S.filter.constituency = 'all'; renderPool(); };
$('#distSel').onchange = e => { S.filter.district = e.target.value; S.filter.constituency = 'all'; if (e.target.value !== 'all') S.filter.state = STATE_OF[e.target.value]; renderPool(); };
$('#conSel').onchange = e => {
  const c = e.target.value; S.filter.constituency = c;
  if (c !== 'all') { S.filter.district = Object.keys(DISTRICTS).find(d => DISTRICTS[d].includes(c)); S.filter.state = STATE_OF[S.filter.district]; }
  renderPool();
};
$('#q').oninput = e => { S.filter.q = e.target.value; renderPool(); };
$('#poolFab').onclick = () => $('#pool').classList.add('open');
$('#poolClose').onclick = () => $('#pool').classList.remove('open');
$('#pickCancel').onclick = () => { S.sel = null; renderAll(); };
$('#edSel').onchange = async e => { await saveAll(); S.cur = e.target.value; S.pageIdx = 0; filterForEdition(ed()); try { await loadEditionNews(); } catch (err) { toast(err.message); } renderAll(); };
$('#newEd').onclick = openNewEdition;
$('#settingsBtn').onclick = openSettings;
$('#previewBtn').onclick = () => { S.preview = !S.preview; S.sel = null; renderAll(); $('#canvas').scrollTop = 0; };
$('#printBtn').onclick = printEdition;
$('#saveBtn').onclick = saveClick;
$('#logoutBtn').onclick = logout;
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && !S.viewer) { e.preventDefault(); saveClick(); } });
window.addEventListener('beforeunload', e => { if (unsaved.size || saving) { saveAll(); e.preventDefault(); e.returnValue = ''; } });
function showUser() {
  const u = store.get('jv_user', null);
  if (MODE === 'api' && u) { $('#modeTag').textContent = `Connected · ${u.name}`; $('#logoutBtn').title = `Signed in as ${u.name} (${u.email})`; }
}
$('#publishBtn').onclick = publish;
new ResizeObserver(fit).observe($('#canvas'));

/* ---------- boot ---------- */
async function boot() {
  const m = location.pathname.match(/\/e\/([\w-]+)/) || location.search.match(/[?&]view=([\w-]+)/);
  try {
    if (m) {
      S.viewer = true; document.getElementById('app').classList.add('viewer');
      if (MODE === 'api') {
        const d = await fetch(CFG.apiBase + '/public/epapers/' + m[1]).then(r => r.ok ? r.json() : Promise.reject(new Error('This edition is not published or the link is wrong.')));
        S.news = (d.news || []).map(mapNews); S.editions = [mapEd(d.epaper)];
      } else {
        S.news = DEMO_NEWS.slice(); S.editions = (store.get('jv_editions', []) || []).filter(e => e.shareSlug === m[1]);
        if (!S.editions.length) throw new Error('Edition not found on this device.');
      }
      S.cur = S.editions[0].id; document.title = `${BRAND.masthead} – ${teDate(ed().editionDate)}`;
      $('#modeTag').textContent = ''; renderAll(); return;
    }
    if (MODE === 'api' && !API.token()) { showLogin(); return; }
    await loadAll(); filterForEdition(ed()); renderAll();
    $('#logoutBtn').hidden = MODE !== 'api' || !!window.__JV_TOKEN; showUser(); showSave();
  } catch (err) {
    $('#canvas').innerHTML = `<p style="padding:24px;text-align:center">${esc(err.message)}</p>`;
  }
}
boot();
})();
